<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Registrar</title>
</head>

<body>
    <form>
        <h1>Registrar-se</h1>
        <div class="inputEmail">
            <label for="email">Email:</label><br>
            <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="off">
        </div>
        <div class="inputSenha">
            <label for="senha">Senha:</label><br>
            <input id="senha" name="senha" type="password" placeholder="Senha">
            
        </div>
        <div class="inputSenha">
            <label for="senha">Digite novamente:</label><br>
            <input type="password" name="password" placeholder="Sua senha">
        </div>
        <div class="buttons">
            <button type="button" id="register-button" onclick="register()">Cadastrar</button><br>
            <button type="button" onclick="pagLogin()">Voltar para o Login</button>
        </div>
    </form>
</body>
<script src="./js/index.js"></script>
<script src="./js/validations.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="./js/firebaseInit.js"></script>
<script src="./js/loading.js"></script>

</html>
