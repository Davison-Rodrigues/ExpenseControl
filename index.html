<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Login</title>
</head>

<body>
    <form>
        <h1>Bem-vindo(a)</h1>
        <div class="inputEmail">
            <label for="email">Email:</label><br>
            <input id="email" name="email" type="email" placeholder="seu@email.com" onchange="onChangeEmail()" autocomplete="off">
            <div class="error" id="email-required-error">Email é obrigatório!</div>
            <div class="error" id="email-invalid-error">Email inválido!</div>
        </div>
        <div class="inputSenha">
            <label for="senha">Senha:</label><br>
            <input id="senha" name="senha" type="password" placeholder="Senha" onchange="onChangePassword()">
            <div class="error" id="password-required-error">Senha é obrigatório!</div>
            <div class="error" id="password-invalid-error">Senha inválida!</div>
            <br>
            <button type="button" disabled="true" id="recover-password-button" onclick="recoverPassword()">Recuperar Senha</button>
        </div>
        <div class="buttons">
            <button type="button" onclick="login()" disabled="true" id="login-button">Entrar</button><br>
            <button type="button" class="registro" onclick="goRegister()">Registrar-se</button>
        </div>
    </form>
</body>
<script src="./js/index.js"></script>
<script src="./js/validations.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="./js/firebaseInit.js"></script>
<script src="./js/loading.js"></script>

</html>
