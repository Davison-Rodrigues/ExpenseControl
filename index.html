<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login</title>
</head>
<body>
    <form action="">
        <h1>Bem-vindo(a)</h1>
        <div class="inputEmail">
            <label for="email">Email:</label><br>
            <input id="email" name="email" type="email" placeholder="seu@email.com" onchange="validateFields()">
        </div>
        <div class="inputSenha">
            <label for="senha">Senha:</label><br>
            <input id="senha" name="senha" type="password" placeholder="Senha">
            <br>
            <button type="button" disabled="true" id="recover-password-button">Recuperar Senha</button>
        </div>
        <div class="buttons">
            <button type="button" onclick="" disabled="true" id="login-button">Entrar</button><br>
            <button type="button" class="registro" disabled="true">Registrar-se</button>
        </div>
    </form>

    <script src="index.js"></script>
</body>
</html>
